<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#d4c5a9"/>
  <!-- Arena -->
  <rect x="100" y="200" width="600" height="200" fill="#c4b08a" rx="10"/>
  <rect x="120" y="220" width="560" height="160" fill="#b8a47e" rx="5" stroke="#a08860" stroke-width="2" stroke-dasharray="10,5"/>
  <!-- Fence -->
  <g stroke="#8B7355" stroke-width="3">
    <line x1="120" y1="220" x2="120" y2="380"/>
    <line x1="680" y1="220" x2="680" y2="380"/>
    <line x1="120" y1="260" x2="680" y2="260"/>
    <line x1="120" y1="340" x2="680" y2="340"/>
  </g>
  <!-- Jump obstacle -->
  <g transform="translate(350, 280)">
    <rect x="0" y="0" width="8" height="60" fill="#c0392b" opacity="0.5"/>
    <rect x="80" y="0" width="8" height="60" fill="#c0392b" opacity="0.5"/>
    <rect x="0" y="15" width="88" height="8" fill="#e74c3c" opacity="0.4" rx="4"/>
    <rect x="0" y="35" width="88" height="8" fill="#e74c3c" opacity="0.4" rx="4"/>
  </g>
  <text x="400" y="460" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#8B7355" opacity="0.5">KOLBIŠTĚ — nahraďte fotografií</text>
</svg>
