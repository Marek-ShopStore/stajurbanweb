<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#d9cdb8"/>
  <!-- Stable interior -->
  <rect x="50" y="80" width="500" height="250" fill="#c4b59a"/>
  <!-- Stall doors -->
  <g fill="#a08860" stroke="#8B7355" stroke-width="2">
    <rect x="80" y="130" width="100" height="200"/>
    <rect x="200" y="130" width="100" height="200"/>
    <rect x="320" y="130" width="100" height="200"/>
    <rect x="440" y="130" width="100" height="200"/>
  </g>
  <!-- Half doors -->
  <g fill="#b8a47e" stroke="#8B7355" stroke-width="2">
    <rect x="80" y="130" width="100" height="80"/>
    <rect x="200" y="130" width="100" height="80"/>
    <rect x="320" y="130" width="100" height="80"/>
    <rect x="440" y="130" width="100" height="80"/>
  </g>
  <!-- Horse heads peeking -->
  <circle cx="130" cy="155" r="15" fill="#6B4226" opacity="0.4"/>
  <circle cx="370" cy="155" r="15" fill="#3d2b1f" opacity="0.4"/>
  <text x="300" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#8B7355" opacity="0.5">STÁJE — nahraďte fotografií</text>
</svg>
